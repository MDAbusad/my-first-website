<script>
function order(product) {
  const phone = "919128020016";

  const prices = {
    "Smart Watch": 499,
    "Headphones": 799,
    "Travel Bag": 599
  };

  const message =
    `Hello, I want to order ${product} for ₹${prices[product]}.`;

  const url = "https://wa.me/" + phone +
    "?text=" + encodeURIComponent(message);

  window.open(url, "_blank");
}
</script>
